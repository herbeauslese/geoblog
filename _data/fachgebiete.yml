# Taxonomie des Geo-Wikis.
#
# Jede Kategorie besitzt eine eindeutige `id` (= Ordnername unter _wiki/,
# = Wert des Front-Matter-Feldes `kategorie`). `parent: null` markiert eine
# Ebene-1-Kategorie. Weitere Ebenen werden durch zusätzliche Einträge mit
# gesetztem `parent` ergänzt — die Struktur ist beliebig tief erweiterbar,
# ohne dass Layout, Sidebar oder Breadcrumbs angepasst werden müssen.

- id: grundlagen-methoden
  titel: "Grundlagen & Methoden"
  parent: null
  kurzbeschreibung: >
    Einführung in die Geographie, Wissenschaftstheorie, Fachgeschichte,
    Forschungsmethoden, Statistik und grundlegende Kartenkunde.

- id: physische-geographie
  titel: "Physische Geographie"
  parent: null
  kurzbeschreibung: >
    Geomorphologie, Klimatologie, Hydrologie, Bodengeographie, Biogeographie,
    Glaziologie, Küsten- und Meeresgeographie, Landschaftsökologie.

- id: humangeographie
  titel: "Humangeographie"
  parent: null
  kurzbeschreibung: >
    Wirtschafts-, Sozial-, Bevölkerungs-, Politische, Kultur-, Stadt-,
    Verkehrs- und Tourismusgeographie.

- id: regionale-geographie
  titel: "Regionale Geographie & Länderkunde"
  parent: null
  kurzbeschreibung: >
    Kontinente, Länder, Regionen sowie naturräumliche und kulturelle
    Großräume der Erde.

- id: geoinformatik-kartographie
  titel: "Geoinformatik, Kartographie & Fernerkundung"
  parent: null
  kurzbeschreibung: >
    Geographische Informationssysteme, Fernerkundung, Kartographie,
    Geodäsie und Geostatistik.

- id: angewandte-geographie
  titel: "Angewandte Geographie & Raumplanung"
  parent: null
  kurzbeschreibung: >
    Stadt- und Regionalplanung, Landschaftsplanung, Umweltplanung,
    Entwicklungsgeographie sowie Risiko- und Naturgefahrenmanagement.

- id: mensch-umwelt-globaler-wandel
  titel: "Mensch-Umwelt-Beziehungen & Globaler Wandel"
  parent: null
  kurzbeschreibung: >
    Klimawandel, Nachhaltigkeitsforschung, Ressourcengeographie,
    Political Ecology und Umweltgerechtigkeit.

- id: geowissenschaften
  titel: "Angrenzende Geowissenschaften"
  parent: null
  kurzbeschreibung: >
    Geologie, Mineralogie & Petrologie, Paläontologie, Geophysik,
    Seismologie & Vulkanologie, Ozeanographie, Meteorologie, Bodenkunde,
    Planetologie.

- id: glossar-nachschlagewerk
  titel: "Glossar & Nachschlagewerk"
  parent: null
  kurzbeschreibung: >
    Fachbegriffe, Personen der Geographiegeschichte, Zeittafeln und
    Klassifikationssysteme.

# ---------------------------------------------------------------------------
# Ebene 2 — Unterkategorien je Hauptkategorie
# ---------------------------------------------------------------------------

# Grundlagen & Methoden
- id: geschichte-der-geographie
  titel: "Geschichte der Geographie"
  parent: grundlagen-methoden
  kurzbeschreibung: >
    Entwicklung des Faches von der Antike bis zur modernen Geographie,
    zentrale Denkschulen und Paradigmenwechsel.

- id: wissenschaftstheorie-geographie
  titel: "Wissenschaftstheorie & Grundbegriffe"
  parent: grundlagen-methoden
  kurzbeschreibung: >
    Raum-, Orts- und Landschaftskonzepte, erkenntnistheoretische Positionen
    und das Selbstverständnis der Geographie als Fach.

- id: forschungsmethoden-geographie
  titel: "Forschungsmethoden der Geographie"
  parent: grundlagen-methoden
  kurzbeschreibung: >
    Qualitative und quantitative Erhebungs- und Auswertungsverfahren,
    Feldmethoden, Fallstudiendesign.

- id: statistik-geographie
  titel: "Statistik & quantitative Methoden"
  parent: grundlagen-methoden
  kurzbeschreibung: >
    Deskriptive und schließende Statistik, räumliche Statistik und
    Modellbildung in der Geographie.

- id: kartenkunde
  titel: "Kartenkunde & Orientierung"
  parent: grundlagen-methoden
  kurzbeschreibung: >
    Kartenlesen, Maßstab, Projektionen, Koordinatensysteme und
    Geländeorientierung als Grundfertigkeiten.

# Physische Geographie
- id: geomorphologie
  titel: "Geomorphologie"
  parent: physische-geographie
  kurzbeschreibung: >
    Lehre von den Landoberflächenformen und den exogenen wie endogenen
    Prozessen ihrer Entstehung.

- id: klimatologie
  titel: "Klimatologie"
  parent: physische-geographie
  kurzbeschreibung: >
    Wissenschaft von Klima, Klimazonen, Klimadynamik und
    Klimaklassifikation.

- id: hydrologie
  titel: "Hydrologie"
  parent: physische-geographie
  kurzbeschreibung: >
    Wasserkreislauf, Gewässerkunde, Grundwasser und hydrologische
    Prozesse an Land.

- id: bodengeographie
  titel: "Bodengeographie"
  parent: physische-geographie
  kurzbeschreibung: >
    Räumliche Verbreitung, Genese und Klassifikation von Böden im
    Landschaftszusammenhang.

- id: biogeographie
  titel: "Biogeographie"
  parent: physische-geographie
  kurzbeschreibung: >
    Räumliche Verbreitung von Pflanzen und Tieren, Vegetationszonen und
    Ökozonen der Erde.

- id: glaziologie-periglazialmorphologie
  titel: "Glaziologie & Periglazialmorphologie"
  parent: physische-geographie
  kurzbeschreibung: >
    Gletscher, Eiszeiten, Permafrost und die Formung von Landschaften
    durch Eis und Kälte.

- id: kuesten-und-meeresgeographie
  titel: "Küsten- und Meeresgeographie"
  parent: physische-geographie
  kurzbeschreibung: >
    Küstenformen, Meeresströmungen, Gezeiten und die Dynamik von
    Land-Meer-Übergängen.

- id: landschaftsoekologie
  titel: "Landschaftsökologie"
  parent: physische-geographie
  kurzbeschreibung: >
    Wechselwirkungen zwischen Landschaftselementen, Stoffkreisläufe und
    Ökosystemfunktionen im Raum.

# Humangeographie
- id: wirtschaftsgeographie
  titel: "Wirtschaftsgeographie"
  parent: humangeographie
  kurzbeschreibung: >
