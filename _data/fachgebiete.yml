- id: bevoelkerungsgeographie
  titel: "Bevölkerungsgeographie"
  parent: humangeographie
  kurzbeschreibung: >
    Bevölkerungsverteilung, demographischer Wandel, Migration und
    Bevölkerungsdynamik.

- id: politische-geographie
  titel: "Politische Geographie"
  parent: humangeographie
  kurzbeschreibung: >
    Staatsgrenzen, Geopolitik, räumliche Machtstrukturen und politische
