- id: kulturgeographie
  titel: "Kulturgeographie"
  parent: humangeographie
  kurzbeschreibung: >
    Räumliche Ausprägung kultureller Praktiken, Identitäten und
    Bedeutungszuschreibungen.

- id: stadtgeographie
  titel: "Stadtgeographie"
  parent: humangeographie
  kurzbeschreibung: >
    Struktur, Funktion und Entwicklung von Städten sowie
    Urbanisierungsprozesse.

- id: verkehrsgeographie
  titel: "Verkehrsgeographie"
  parent: humangeographie
  kurzbeschreibung: >
    Räumliche Muster von Mobilität, Verkehrsinfrastruktur und
    Erreichbarkeit.

- id: tourismusgeographie
  titel: "Tourismusgeographie"
  parent: humangeographie
  kurzbeschreibung: >
    Räumliche Strukturen und Wirkungen von Tourismus sowie
    Destinationsentwicklung.

- id: agrargeographie
  titel: "Agrargeographie"
  parent: humangeographie
  kurzbeschreibung: >
    Räumliche Organisation von Landwirtschaft, ländlichem Raum und
    Agrarstrukturwandel.

