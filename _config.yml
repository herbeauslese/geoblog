title: Geo-Wiki
description: "Ein wissenschaftliches Nachschlagewerk zur Geographie und angrenzenden Geowissenschaften — von den Grundlagen bis zu aktuellen Forschungsthemen."

# --- Theme-Spike: jekyll-98 (Windows-98-Look) ---
# Nur Optik-Test (siehe Chat). desktop_categories/show_categories bewusst
# AUS gelassen: die brauchen laut Theme-README einen eigenen GitHub-Actions-
# Workflow statt des klassischen "Deploy from branch"-Builds, den dieses
# Repo nutzt, und würden sonst als tote 404-Links enden. Auch strukturell
# (max. ~5-7 Desktop-Icons) passt das Kategorie-Modell nicht zu unserer
# 66-Kategorien-Taxonomie.
remote_theme: queenkjuul/jekyll-98

show_categories: false
show_excerpts: false

jekyll-98:
  icon: computer
  desktop_categories: []
  site_links: []
  social_links:
    github: false
    youtube: false
    twitch: false

plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-feed

markdown: kramdown
kramdown:
  input: GFM

collections:
  wiki:
    output: true
    permalink: /wiki/:path/

defaults:
  - scope:
      path: ""
      type: "wiki"
    values:
      layout: "default"
      published: false
      status: "stub"
      schwierigkeit: "grundlagen"
      tags: []
      verwandte_themen: []
      quellen: []
      literatur: []
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
