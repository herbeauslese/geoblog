title: Geo-Wiki
description: "Ein wissenschaftliches Nachschlagewerk zur Geographie und angrenzenden Geowissenschaften — von den Grundlagen bis zu aktuellen Forschungsthemen."

markdown: kramdown
kramdown:
  input: GFM

collections:
  wiki:
    output: true
    permalink: /wiki/:path/

defaults:
  - scope:
      path: ""
      type: "wiki"
    values:
      layout: "wiki"
      published: false
      status: "stub"
      schwierigkeit: "grundlagen"
      tags: []
      verwandte_themen: []
      quellen: []
      literatur: []
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
