title: Geo-Wiki
description: "Ein wissenschaftliches Nachschlagewerk zur Geographie und angrenzenden Geowissenschaften — von den Grundlagen bis zu aktuellen Forschungsthemen."

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

logo: "/assets/images/earthspin.gif"

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

markdown: kramdown
kramdown:
  input: GFM

collections:
  wiki:
    output: true
    permalink: /wiki/:path/

just_the_docs:
  collections:
    wiki:
      name: Wiki
      nav_fold: true
      search_exclude: false

defaults:
  - scope:
      path: ""
      type: "wiki"
    values:
      layout: "default"
      published: false
      status: "stub"
      schwierigkeit: "grundlagen"
      tags: []
      verwandte_themen: []
      quellen: []
      literatur: []
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
