title: Geo-Wiki
description: "Ein wissenschaftliches Nachschlagewerk zur Geographie und angrenzenden Geowissenschaften — von den Grundlagen bis zu aktuellen Forschungsthemen."

# --- Theme-Spike: jekyll-theme-console ---
# Nur Optik-Test (siehe Chat). Keine eigene Navigation/Suche in diesem
# Schritt, das Theme bringt selbst keine mit. style: dark | light | hacker | nord
remote_theme: b2a3e8/jekyll-theme-console
style: hacker

# Ohne diese Liste würde das Theme automatisch ALLE ~66 Wiki-Seiten als
# flaches Kopfmenü auflisten (das Theme hat keine Baum-Navigation). Für
# den Optik-Spike bewusst nur die Startseite.
header_pages:
  - index.md

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

markdown: kramdown
kramdown:
  input: GFM

collections:
  wiki:
    output: true
    permalink: /wiki/:path/

defaults:
  - scope:
      path: ""
      type: "wiki"
    values:
      layout: "default"
      published: false
      status: "stub"
      schwierigkeit: "grundlagen"
      tags: []
      verwandte_themen: []
      quellen: []
      literatur: []
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
