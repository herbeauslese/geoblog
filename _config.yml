title: NFL-Wiki
description: "Eine Wissensdatenbank rund um American Football (primär NFL) — von den Grundlagen bis zu Scheme-Tiefe: Formationen, Coverages, Route-Concepts und Situational Football."

markdown: kramdown
kramdown:
  input: GFM

collections:
  wiki:
    output: true
    permalink: /wiki/:path/

defaults:
  - scope:
      path: ""
      type: "wiki"
    values:
      layout: "wiki"
      published: false
      status: "stub"
      schwierigkeit: "grundlagen"
      tags: []
      verwandte_themen: []
      quellen: []
      literatur: []
      infobox: []
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - vendor
